[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nextnote"
version = "0.1.1"
description = "Monophonic music generation reusing the Markov core from nexttoken-core"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "music21",
    "mido",
    # The shared Markov core. Older nexttoken (github.com/Artiomio/nexttoken) is
    # kept unchanged for teaching; the reusable core lives in nexttoken-core.
    "nexttoken-core @ git+https://github.com/Artiomio/nexttoken-core.git@f618273b3a44663750e7ef9748bcc99f5296c4a2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
nextnote-experiment = "nextnote.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
